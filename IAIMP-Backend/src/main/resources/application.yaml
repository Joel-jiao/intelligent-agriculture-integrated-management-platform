server:
  port: ${SERVER_PORT:3001}

spring:
  application:
    name: IAIMP-Backend
  datasource:
    # MySQL 数据库：表结构由 sql/agri_platform.sql 手动创建，业务数据由后端首次启动自动导入
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/agri_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  jpa:
    hibernate:
      # 表结构由 sql/agri_platform.sql 管理，Hibernate 不建表、不改表
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# 业务自定义配置
app:
  auth:
    # JWT 签名密钥（仅示例占位，生产环境务必通过环境变量覆盖）
    secret: ${AUTH_SECRET:agri-platform-demo-secret-2026}
    # 令牌有效期（毫秒），与前端 json-server 一致为 12 小时
    ttl-ms: ${AUTH_TTL_MS:43200000}
  cors:
    # 前端开发地址（Vite 默认 5173），生产请显式收紧
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Knife4j / springdoc 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-version: false
